[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    # Hardened CSP per team guide. connect-src uses https: (not explicit allowlist)
    # because the app talks to configurable RPC endpoints at runtime. Fonts are
    # bundled locally, so no external font hosts are needed.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss://relay.walletconnect.org; frame-src 'self'; frame-ancestors 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
